name: Starlight Knowledge Tree CI & Community Distribution

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Knowledge Graph Schemas & Edge Targets
        run: npm run validate

      - name: Run Scale Benchmark Stress-Test
        run: npx tsx scripts/scale-graph-benchmark.ts

      - name: Package Community Distribution Bundle
        run: npx tsx scripts/export-community-distribution.ts

      - name: Build Next.js Web Portal (SSG)
        run: npm run build --workspace @starlight/web

      - name: Upload Community Distribution Artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: starlight-community-distribution
          path: dist/community-distribution/
